<!-- ============================================================
     Complete Contact ERP — scorecard loader
     Paste this whole block into ONE full-width Custom HTML / Code
     element in GoHighLevel. Nothing else goes on the page.

     Loads the page from GitHub, so a commit there appears here
     without touching GHL. The repo must stay PUBLIC — a token
     must never be put in client-side HTML.

     Deploy at: go.ccerp.pro/erp-fit-scoreboard  (already live on this slug)
     ============================================================ -->

<div id="ccerp-mount" style="font:15px/1.5 system-ui,-apple-system,Arial,sans-serif;padding:60px 20px;text-align:center;color:#667">
  Loading&hellip;
</div>

<script>
(function () {
  // Primary is the CDN (fast, cached ~12h). Fallback is raw GitHub (always
  // current, not a CDN). Pin a commit SHA in place of @main for a version
  // that never moves on you.
  var FILE = "scorecard.v2026-10-20.html";
  var SRCS = [
    "https://cdn.jsdelivr.net/gh/automate2scale/complete-contact-erp@main/" + FILE,
    "https://raw.githubusercontent.com/automate2scale/complete-contact-erp/main/" + FILE
  ];
  var FALLBACK = "mailto:oscar@completecontact.net";
  var mount = document.getElementById("ccerp-mount");
  if (!mount) return;

  function fail(e) {
    mount.innerHTML =
      '<p style="font:16px/1.6 system-ui,Arial,sans-serif;padding:48px 16px;text-align:center">' +
      'The scorecard did not load. Please refresh, or email ' +
      '<a href="' + FALLBACK + '" style="color:#0D87D4;font-weight:700">oscar@completecontact.net</a> ' +
      'and we will send your assessment across.</p>';
    if (window.console) console.error("CCERP loader:", e);
  }

  function render(html) {
    var doc = new DOMParser().parseFromString(html, "text/html");

    // 1. carry the page's own styles and font links into this document
    doc.querySelectorAll("head style, head link").forEach(function (n) {
      document.head.appendChild(n.cloneNode(true));
    });

    // 2. move the markup in (scripts are skipped here — see step 3)
    mount.innerHTML = "";
    mount.removeAttribute("style");
    Array.prototype.slice.call(doc.body.childNodes).forEach(function (n) {
      if (n.nodeName === "SCRIPT") return;
      mount.appendChild(document.importNode(n, true));
    });

    // 3. scripts injected as markup never run — they have to be re-created.
    //    Everything depends on this: the 15 questions, the scoring, the
    //    lead gate and the 43-field webhook post to GoHighLevel.
    doc.querySelectorAll("body script").forEach(function (old) {
      var s = document.createElement("script");
      if (old.src) { s.src = old.src; } else { s.textContent = old.textContent; }
      document.body.appendChild(s);
    });
  }

  function load(i) {
    if (i >= SRCS.length) { fail(new Error("all sources failed")); return; }
    fetch(SRCS[i], { cache: "no-cache" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(render)
      .catch(function (e) {
        if (window.console) console.warn("CCERP loader: " + SRCS[i] + " failed —", e.message);
        load(i + 1);
      });
  }

  load(0);
})();
</script>
